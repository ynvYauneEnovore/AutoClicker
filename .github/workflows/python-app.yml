name: Build EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyautogui keyboard pyinstaller
        
    - name: Build EXE
      run: pyinstaller --onefile --noconsole interfaz.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-Ejecutable
        path: dist/interfaz.exe
